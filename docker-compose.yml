# Всё приложение — один контейнер `app` (фронт + API + бот).
#   локально:    docker compose up -d --build   → http://localhost:8080
#   на сервере:  в .env COMPOSE_PROFILES=https и DOMAIN=app.ваш-домен.ru → добавится Caddy с HTTPS на 80/443
name: hack-max

services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - app-data:/data
    ports:
      - "${HTTP_PORT:-8080}:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # HTTPS для сервера: MAX открывает мини-приложения только по https
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
