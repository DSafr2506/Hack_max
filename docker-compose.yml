# Всё приложение одной командой:  docker compose up -d --build
# Локально: DOMAIN=:80 → http://localhost.  На сервере: DOMAIN=app.ваш-домен.ru → https с автосертификатом.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    expose:
      - "8000"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
